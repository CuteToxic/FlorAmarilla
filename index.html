<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para ti 🌻</title>
    <style>
        /* Importamos fuentes elegantes de Google Fonts */
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Lora:ital@1&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #051014; /* Fondo de noche oscuro y elegante */
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #FFF;
        }

        /* El lienzo donde crecen las flores */
        #jardin {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Estilos del mensaje */
        .mensaje-container {
            position: absolute;
            z-index: 2;
            text-align: center;
            opacity: 0;
            animation: aparecer 4s ease-in-out forwards;
            animation-delay: 1.5s; /* El texto aparece poco a poco */
            padding: 20px;
            max-width: 700px;
            pointer-events: none; /* Para que no interfiera si hace clic en la pantalla */
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            color: #FFD700;
            font-size: 3.5rem;
            margin-bottom: 10px;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
        }

        p {
            font-family: 'Lora', serif;
            font-size: 1.6rem;
            color: #FFF8DC;
            line-height: 1.6;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        @keyframes aparecer {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Diseño responsivo para celulares */
        @media (max-width: 600px) {
            h1 { font-size: 2.5rem; }
            p { font-size: 1.2rem; }
            .mensaje-container { padding: 30px; }
        }
    </style>
</head>
<body>

    <canvas id="jardin"></canvas>
    
    <div class="mensaje-container">
        <h1>Para ti...</h1>
        <p>"Quiero conocerte cada día un poquito más, y que el tiempo sea solo un escalón hacia lo más bonito que podamos construir juntos."</p>
    </div>

    <script>
        const canvas = document.getElementById('jardin');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let flores = [];
        let particulas = [];

        // Función para generar números aleatorios
        function random(min, max) { 
            return Math.random() * (max - min) + min; 
        }

        // Clase para las luciérnagas (polvo de hadas)
        class Particula {
            constructor() {
                this.x = random(0, canvas.width);
                this.y = random(0, canvas.height);
                this.size = random(1, 2.5);
                this.speedY = random(-1, -0.2);
                this.speedX = random(-0.5, 0.5);
                this.opacity = random(0.3, 0.8);
            }
            update() {
                this.y += this.speedY;
                this.x += this.speedX;
                if (this.y < 0) this.y = canvas.height;
                if (this.x < 0) this.x = canvas.width;
                if (this.x > canvas.width) this.x = 0;
                
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 220, 100, ${this.opacity})`;
                ctx.fill();
            }
        }

        // Clase para las flores amarillas
        class Flor {
            constructor() {
                this.x = random(50, canvas.width - 50);
                this.y = canvas.height + 50;
                this.targetY = random(canvas.height - 400, canvas.height - 100);
                this.stemHeight = 0;
                this.maxStemHeight = this.y - this.targetY;
                this.grown = false;
                this.bloomSize = 0;
                this.maxBloom = random(15, 35);
                this.petals = Math.floor(random(10, 16));
                this.color = `hsl(${random(40, 55)}, 100%, 55%)`; // Tonos de amarillo y dorado
                this.delay = random(50, 250); // Retraso para que crezcan en distintos momentos
                this.timer = 0;
                this.sway = random(0, Math.PI * 2);
            }
            draw() {
                if (this.timer < this.delay) {
                    this.timer++;
                    return;
                }
                
                // Animación de crecimiento del tallo
                if (this.stemHeight < this.maxStemHeight) {
                    this.stemHeight += 1.5;
                } else {
                    this.grown = true;
                }

                let currentY = this.y - this.stemHeight;
                let swayOffset = Math.sin(this.sway) * 15 * (this.stemHeight / this.maxStemHeight);
                this.sway += 0.015; // Velocidad del balanceo con el viento

                // Dibujar el tallo
                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                ctx.quadraticCurveTo(this.x + swayOffset * 2, this.y - this.stemHeight / 2, this.x + swayOffset, currentY);
                ctx.strokeStyle = '#2d6a4f';
                ctx.lineWidth = 4;
                ctx.stroke();

                // Dibujar la flor
                if (this.grown) {
                    if (this.bloomSize < this.maxBloom) this.bloomSize += 0.3; // Velocidad de apertura

                    ctx.save();
                    ctx.translate(this.x + swayOffset, currentY);
                    
                    // Dibujar pétalos
                    for (let i = 0; i < this.petals; i++) {
                        ctx.rotate((Math.PI * 2) / this.petals);
                        ctx.beginPath();
                        ctx.ellipse(0, this.bloomSize, this.bloomSize / 3, this.bloomSize, 0, 0, Math.PI * 2);
                        ctx.fillStyle = this.color;
                        ctx.fill();
                        ctx.strokeStyle = '#d4af37';
                        ctx.lineWidth = 0.5;
                        ctx.stroke();
                    }
                    
                    // Dibujar el centro de la flor (tipo girasol/margarita)
                    ctx.beginPath();
                    ctx.arc(0, 0, this.bloomSize / 2.5, 0, Math.PI * 2);
                    ctx.fillStyle = '#5c4033'; // Marrón oscuro
                    ctx.fill();
                    ctx.restore();
                }
            }
        }

        // Inicializar luciérnagas y flores
        for(let i=0; i<60; i++) particulas.push(new Particula());
        for(let i=0; i<35; i++) flores.push(new Flor()); // 35 flores en pantalla

        // Bucle de animación principal
        function animar() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            particulas.forEach(p => p.update());
            flores.forEach(f => f.draw());

            requestAnimationFrame(animar);
        }
        animar();

        // Ajustar el canvas si se cambia el tamaño de la pantalla
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
